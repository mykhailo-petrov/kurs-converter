<header class="header" data-header="60">
	<div class="header__container">
		<a
			href="#converter"
			data-goto="#converter"
			data-goto-header
			class="header__logo logo"
			>kurs</a
		>
		<nav class="header__menu menu">
			<ul class="menu__list" data-menu="noclose">
				<li class="menu__item _active" data-menu-item>
					<a
						href="#converter"
						data-goto="#converter"
						data-goto-header
						class="menu__link"
						>Converter</a
					>
				</li>
				<li class="menu__item" data-menu-item>
					<a
						href="#rates"
						data-goto="#rates"
						data-goto-header
						class="menu__link"
						>Rates</a
					>
				</li>
				<li class="menu__item" data-menu-item>
					<a
						href="#charts"
						data-goto="#charts"
						data-goto-header
						class="menu__link"
						>Charts</a
					>
				</li>
				<li class="menu__item" data-menu-item>
					<a
						href="https://frankfurter.dev"
						target="_blank"
						rel="noopener noreferrer"
						class="menu__link"
						>API</a
					>
				</li>
			</ul>
		</nav>

		<button
			type="button"
			data-da=".menu,767"
			class="header__button button button--l button--secondary button--arrow-right"
		>
			Comprar
		</button>
		<button
			type="button"
			class="header__burger burger-menu"
			data-burger="unlock"
			aria-label="Menu"
		></button>
	</div>
</header>
